<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Conta</title>
<style>
:root{--bg:#0b1020;--bg2:#121935;--card:#151c3a;--line:#262f5a;--text:#eef1ff;--mute:#9aa5d1;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--accent:#8b5cf6;--accent2:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px;background:radial-gradient(900px 400px at 10% -10%,#2a1f6b55,transparent),radial-gradient(800px 400px at 100% 0,#0e7490440,transparent),var(--bg)}
.wrap{max-width:880px;margin:0 auto;display:grid;gap:16px}
h1{font-size:24px;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.form,.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:12px}
.form{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;color-scheme:dark}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;cursor:pointer}
button.pri{background:linear-gradient(90deg,var(--accent),#6366f1);border-color:transparent;font-weight:700}
button.del{color:var(--bad)}
.msg{font-size:12px;grid-column:1/-1;color:var(--bad);min-height:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{padding:12px}.stat b{font-size:24px;display:block;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.card{padding:14px;border-left:4px solid var(--c)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info{flex:1;min-width:180px}.info small{color:var(--mute);display:block;margin-top:3px}
.badge{font-weight:700;font-size:13px;color:var(--c)}
.bar{height:6px;background:var(--bg2);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.empty{text-align:center;color:var(--mute);padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>Controle de Conta</h1><div class="sub">Acompanhamento individual de 30 dias. Cadastre a entrada e veja quando cada conta expira.</div></div>
  <form class="form" id="form">
    <div><label for="cliente">Nome do cliente</label><input id="cliente" placeholder="Ex.: João Silva" autocomplete="off"></div>
    <div><label for="loja">Nome da loja</label><input id="loja" placeholder="Ex.: Loja do João" autocomplete="off"></div>
    <div><label for="inicio">Data de entrada</label><input id="inicio" type="date"></div>
    <div><label for="fim">Expira em (automático)</label><input id="fim" readonly placeholder="—"></div>
    <button class="pri" type="submit">Adicionar</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="stats" id="stats"></div>
  <div id="lista" style="display:grid;gap:8px"></div>
</div>
<script>
// Banco: tabela controle_conta no Supabase (chave anon é pública por natureza)
const SB_URL='https://dztljrtiishmwxzbxode.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6dGxqcnRpaXNobXd4emJ4b2RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3ODA5OTAsImV4cCI6MjA5MTM1Njk5MH0.AUbNR-lXwdZKtFOhLhLZwDVDVuHPdZNsY2nk4C0L5vA';
const T=SB_URL+'/rest/v1/controle_conta';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const DIAS=30;
let contas=[],pendente=null,carregado=false;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>iso(new Date());
const soma=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n));};
const br=s=>s.split('-').reverse().join('/');
const dias=s=>{const[y,m,d]=s.split('-').map(Number),[a,b,c]=hoje().split('-').map(Number);return Math.round((new Date(y,m-1,d)-new Date(a,b-1,c))/864e5);};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function carregar(){
  try{
    const r=await fetch(T+'?select=*&order=inicio.asc',{headers:H});
    if(!r.ok)throw new Error(r.status);
    contas=await r.json();carregado=true;$('msg').textContent='';
  }catch(e){$('msg').textContent='Não consegui carregar as contas. Verifique a internet e recarregue.';}
  render();
}
function previa(){$('fim').value=$('inicio').value?br(soma($('inicio').value,DIAS)):'';}
$('inicio').addEventListener('input',previa);
$('inicio').value=hoje();previa();

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const cliente=$('cliente').value.trim(),loja=$('loja').value.trim(),inicio=$('inicio').value;
  if(!cliente||!loja||!inicio){$('msg').textContent='Preencha o cliente, a loja e a data de entrada.';return;}
  $('msg').textContent='';
  const row={id:String(Date.now()),cliente,loja,inicio};
  try{
    const r=await fetch(T,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(row)});
    if(!r.ok)throw new Error(r.status);
    contas.push(row);$('cliente').value='';$('loja').value='';$('inicio').value=hoje();previa();render();
  }catch(err){$('msg').textContent='Não foi possível salvar. Tente de novo.';}
});
async function agir(id,acao){
  if(!pendente||pendente.id!==id||pendente.acao!==acao){pendente={id,acao};render();return;}
  pendente=null;
  try{
    const url=T+'?id=eq.'+encodeURIComponent(id);
    const r=acao==='renovar'
      ?await fetch(url,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({inicio:hoje()})})
      :await fetch(url,{method:'DELETE',headers:H});
    if(!r.ok)throw new Error(r.status);
    await carregar();
  }catch(err){$('msg').textContent='Não foi possível concluir a ação. Tente de novo.';render();}
}
function render(){
  const l=contas.map(c=>{const fim=soma(c.inicio,DIAS);return{...c,fim,d:dias(fim)};}).sort((a,b)=>a.d-b.d);
  const venc=l.filter(c=>c.d<0).length,prox=l.filter(c=>c.d>=0&&c.d<=7).length;
  const st=(n,t,k)=>`<div class="stat ${k||''}"><b>${n}</b><span>${t}</span></div>`;
  $('stats').innerHTML=st(l.length,'Contas ativas')+st(l.length-venc-prox,'No prazo','ok')+st(prox,'Expiram em até 7 dias','warn')+st(venc,'Expiradas','bad');
  if(!carregado){$('lista').innerHTML='<div class="empty">Carregando...</div>';return;}
  if(!l.length){$('lista').innerHTML='<div class="empty">Nenhuma conta cadastrada ainda. Preencha o formulário acima.</div>';return;}
  $('lista').innerHTML=l.map(c=>{
    const cor=c.d<0?'var(--bad)':c.d<=7?'var(--warn)':'var(--ok)';
    const txt=c.d<0?`Expirou há ${-c.d} dia${c.d===-1?'':'s'}`:c.d===0?'Expira hoje':`Faltam ${c.d} dia${c.d===1?'':'s'}`;
    const pct=Math.max(0,Math.min(100,Math.round((DIAS-c.d)/DIAS*100)));
    const p=a=>pendente&&pendente.id===c.id&&pendente.acao===a;
    return`<div class="card" style="--c:${cor}"><div class="row">
      <div class="info"><b>${esc(c.loja)}</b><small>${esc(c.cliente)} · entrou em ${br(c.inicio)} · expira em ${br(c.fim)}</small></div>
      <span class="badge">${txt}</span>
      <button onclick="agir('${esc(c.id)}','renovar')">${p('renovar')?'Confirmar renovação':'Renovar 30 dias'}</button>
      <button class="del" onclick="agir('${esc(c.id)}','excluir')">${p('excluir')?'Confirmar exclusão':'Excluir'}</button>
    </div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}
render();carregar();
setInterval(carregar,60000); // atualiza sozinho para quem deixa a página aberta
</script>
</body>
</html>
